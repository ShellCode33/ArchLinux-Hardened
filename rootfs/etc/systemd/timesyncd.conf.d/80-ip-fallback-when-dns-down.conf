# Prefer the Arch Linux NTP pool. Keep a fixed Cloudflare NTP address last
# as a bootstrap fallback when the pool names cannot be resolved or reached.
# This prevents a stale system clock from causing DNSSEC or DNS-over-TLS
# validation failures that would otherwise also prevent NTP synchronization.
NTP=
NTP=0.arch.pool.ntp.org 1.arch.pool.ntp.org 2.arch.pool.ntp.org 3.arch.pool.ntp.org 162.159.200.1
FallbackNTP=
