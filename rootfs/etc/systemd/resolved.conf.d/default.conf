# Default encrypted DNS for connections without a trusted DNS route.
# Wired links override this with their network DNS and Domains=~.
[Resolve]
DNS=
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net
# FallbackDNS is used only when no other DNS configuration is known.
FallbackDNS=
DNSOverTLS=yes

# Validate DNSSEC locally when using the global Quad9 servers.
# Wired links override this with DNSSEC=no for the trusted LAN resolver.
DNSSEC=true

# Network hardening
LLMNR=no
MulticastDNS=no
